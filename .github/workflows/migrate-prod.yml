name: Migrate prod DB

# Llama a POST /api/admin/migrate en producción para aplicar los DDL
# de docs/migrations/*.sql que estén pendientes en Turso. El endpoint
# es idempotente (chequea pragma_table_info / sqlite_master antes de
# cada ALTER / CREATE), así que correr esto en cada push a main es
# barato y resiliente.
#
# Motivación: el flujo manual `turso db shell ... < migration.sql` se
# saltó múltiples sprints sin que nadie lo notara, dejando producción
# con un schema desfasado que rompió el login. Este workflow garantiza
# que la DB de prod se sincroniza con cada deploy.
#
# Secrets requeridos en el repo (Settings → Secrets and variables → Actions):
#   - AUTH_SECRET   (mismo valor que tiene Vercel en su env de producción)
#   - PROD_APP_URL  (ej. https://macro-tracker-beta-topaz.vercel.app, sin slash final)

on:
  push:
    branches: [main]
  workflow_dispatch: # permite disparar manualmente desde la UI

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    # Damos margen para que Vercel termine el deploy de producción del
    # mismo commit antes de invocar el endpoint.
    timeout-minutes: 10

    steps:
      - name: Validate required secrets
        # Si los secrets no están configurados, fallar inmediatamente con
        # mensaje claro en lugar de explotar con un curl exit 3 ("URL
        # malformed") ocho líneas más abajo. La causa más común del fallo
        # de este workflow es que falta PROD_APP_URL en el repo.
        run: |
          MISSING=""
          if [ -z "$PROD_APP_URL" ]; then
            MISSING="$MISSING PROD_APP_URL"
          fi
          if [ -z "$AUTH_SECRET" ]; then
            MISSING="$MISSING AUTH_SECRET"
          fi
          if [ -n "$MISSING" ]; then
            echo "::error::Faltan secrets en el repo:$MISSING"
            echo ""
            echo "Configurar en GitHub → Settings → Secrets and variables → Actions:"
            echo "  - PROD_APP_URL  (ej. https://macro-tracker-beta-topaz.vercel.app)"
            echo "  - AUTH_SECRET   (mismo valor que la env de Vercel)"
            exit 1
          fi
          # Validar que PROD_APP_URL tiene esquema http(s):// — protege
          # contra typos como "macro-tracker.vercel.app" sin protocolo.
          case "$PROD_APP_URL" in
            http://*|https://*) ;;
            *)
              echo "::error::PROD_APP_URL debe empezar con http:// o https:// (recibido: ${PROD_APP_URL:0:20}…)"
              exit 1
              ;;
          esac
          # Normalizar: quitar slash final para evitar // en el path
          NORMALIZED="${PROD_APP_URL%/}"
          echo "PROD_APP_URL=$NORMALIZED" >> "$GITHUB_ENV"
          # Log no sensible: solo mostramos host, no la URL completa por
          # paranoia (aunque PROD_APP_URL no es realmente secreta).
          HOST="${NORMALIZED#https://}"
          HOST="${HOST#http://}"
          echo "Host objetivo: $HOST"
        env:
          PROD_APP_URL: ${{ secrets.PROD_APP_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      - name: Wait for Vercel production deploy of this commit
        # P6: esperamos a que el deploy del COMMIT ACTUAL esté vivo antes de
        # migrar. Antes chequeábamos un 401 de /api/admin/migrate, pero el deploy
        # VIEJO también responde 401 → se migraba contra código viejo. Ahora
        # /api/health expone VERCEL_GIT_COMMIT_SHA y esperamos que coincida.
        # PROD_APP_URL viene normalizado del step anterior vía GITHUB_ENV.
        run: |
          for i in $(seq 1 30); do
            SHA=$(curl -s "$PROD_APP_URL/api/health" | grep -oE '"sha":"[^"]*"' | cut -d'"' -f4)
            if [ "$SHA" = "$EXPECTED_SHA" ]; then
              echo "Deploy del commit actual vivo ($SHA)"
              exit 0
            fi
            echo "[$i/30] Deploy actual aún no vivo (deployed=$SHA, esperado=$EXPECTED_SHA), retry en 10s…"
            sleep 10
          done
          echo "::error::Timeout esperando el deploy del commit actual ($EXPECTED_SHA)"
          exit 1
        env:
          EXPECTED_SHA: ${{ github.sha }}

      - name: Apply migrations
        run: |
          ENDPOINT="$PROD_APP_URL/api/admin/migrate"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "$ENDPOINT" \
            -H "Authorization: Bearer $AUTH_SECRET")
          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)
          echo "Status: $STATUS"
          echo "$BODY" | head -c 4000
          echo ""
          case "$STATUS" in
            200) ;;
            401)
              echo "::error::AUTH_SECRET en GitHub no coincide con el de Vercel. Revisar ambos valores."
              exit 1 ;;
            404)
              echo "::error::Endpoint no existe en producción (deploy aún no propagado o ruta removida)."
              exit 1 ;;
            5*)
              echo "::error::Error interno del endpoint ($STATUS). Revisar logs de Vercel."
              exit 1 ;;
            *)
              echo "::error::Status inesperado ($STATUS) al invocar la migración."
              exit 1 ;;
          esac
          # Validamos que el endpoint no reportó errores internos
          ERRORS=$(echo "$BODY" | grep -oE '"errors":[0-9]+' | head -1 | cut -d':' -f2)
          if [ "${ERRORS:-0}" != "0" ]; then
            echo "::error::Migración completó con $ERRORS errores (ver body arriba)"
            exit 1
          fi
          echo "Migración OK"
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
